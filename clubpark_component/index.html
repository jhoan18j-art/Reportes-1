<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Arial;color:#202124;background:transparent}main{padding:8px}video{width:100%;max-height:62vh;object-fit:cover;background:#111;border-radius:12px;display:block}canvas{display:none}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.controls button{border:0;border-radius:9px;padding:11px 14px;background:#174ea6;color:white;font-weight:600;font-size:14px}.status{padding:9px 11px;border-radius:8px;background:#f1f3f4;margin:8px 0;overflow-wrap:anywhere}.status.ok{background:#e6f4ea;color:#137333}.status.err{background:#fce8e6;color:#b3261e}
</style>
<script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.4.0/dist/streamlit-component-lib.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head><body><main>
<div id="status" class="status">Preparando cámara trasera…</div>
<video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas>
<div class="controls" id="qrControls"><button id="start">Activar cámara trasera</button><button id="stop">Detener cámara</button></div>
<script>
(function(){
 const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
 const status=document.getElementById('status');
 let stream=null, running=false, lastValue='';
 function send(value){ if(window.Streamlit) Streamlit.setComponentValue(value); }
 function say(msg,kind=''){status.textContent=msg;status.className='status '+kind;}
 function stop(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;}
 async function start(){
  stop(); lastValue='';
  try{
   stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'environment'},width:{ideal:1280},height:{ideal:720}}});
  }catch(e){
   stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'environment'}});
  }
  video.srcObject=stream; await video.play(); running=true;
  say('Cámara activa. Apunta al código QR.','ok');
  requestAnimationFrame(scan);
 }
 function scan(){
  if(!running)return;
  if(video.readyState>=2&&video.videoWidth){
   const w=video.videoWidth,h=video.videoHeight; canvas.width=w;canvas.height=h;ctx.drawImage(video,0,0,w,h);
   try{
    const im=ctx.getImageData(0,0,w,h);
    const code=window.jsQR?jsQR(im.data,w,h,{inversionAttempts:'attemptBoth'}):null;
    if(code&&code.data&&code.data.trim()){
     const value=code.data.trim();
     if(value!==lastValue){lastValue=value;send(value);say('QR leído: '+value,'ok');stop();return;}
    }
   }catch(e){}
  }
  requestAnimationFrame(scan);
 }
 document.getElementById('start').onclick=start;
 document.getElementById('stop').onclick=()=>{stop();say('Cámara detenida.');};
 window.addEventListener('message',e=>{if(e.data&&e.data.type==='streamlit:render'){start();}});
 if(window.Streamlit){Streamlit.setComponentReady();Streamlit.setFrameHeight(450);start();}
})();
</script></main></body></html>
