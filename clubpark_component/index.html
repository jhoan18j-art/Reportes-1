<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Club Park - Cámara y Lector QR</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #1A2B20;
  background: transparent;
  font-size: 14px;
}
main { padding: 8px; max-width: 600px; margin: 0 auto; }
.camera-container {
  position: relative;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  background: #071D12;
  border: 2px solid #0B3B24;
  box-shadow: 0 4px 12px rgba(11, 59, 36, 0.15);
}
video { width: 100%; max-height: 58vh; object-fit: cover; display: block; background: #071D12; }
canvas { display: none; }
.qr-overlay {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 230px; height: 230px;
  border: 2px dashed rgba(197, 160, 89, 0.85);
  border-radius: 16px;
  box-shadow: 0 0 0 9999px rgba(7, 29, 18, 0.45);
  pointer-events: none;
}
.qr-overlay::before, .qr-overlay::after {
  content: "";
  position: absolute;
  width: 26px; height: 26px;
  border-color: #C5A059;
  border-style: solid;
}
.qr-overlay::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
.qr-overlay::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 6px 0; }
.controls button, .controls a {
  flex: 1;
  min-width: 150px;
  border: 1px solid #072617;
  border-radius: 8px;
  padding: 12px 15px;
  background: #0B3B24;
  color: #FFFFFF;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
}
.controls button:hover { background: #145A32; }
.controls button:active { transform: scale(0.98); }
.controls button.secondary { background: #E8EFEA; color: #0B3B24; border-color: #C4D7CC; }
.controls button.secondary:hover { background: #D9E6DE; }
.controls button:disabled { opacity: 0.6; cursor: wait; }
.status {
  padding: 10px 14px;
  border-radius: 8px;
  background: #EBF3EE;
  color: #0B3B24;
  border: 1px solid #C4D7CC;
  margin: 8px 0;
  font-weight: 500;
  font-size: 13px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.status.ok { background: #E2F0D9; color: #1E4620; border-color: #A9D18E; }
.status.err { background: #FCE4D6; color: #C65911; border-color: #F8CBAD; }
.hidden { display: none !important; }
#preview { width: 100%; border-radius: 12px; border: 2px solid #0B3B24; margin-top: 8px; display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.4.0/dist/streamlit-component-lib.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
<main>
  <div id="status" class="status">Sistema de cámara institucional Club Park listo. Pulsa el botón verde para activar la cámara.</div>

  <div class="camera-container" id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <div id="qrOverlay" class="qr-overlay"></div>
  </div>

  <canvas id="canvas"></canvas>
  <img id="preview" class="hidden" alt="Vista previa">

  <!-- Controles QR -->
  <div class="controls" id="qrControls">
    <button id="startQR" type="button">📷 Activar cámara trasera</button>
    <button id="switchQR" class="secondary hidden" type="button">🔄 Cambiar cámara</button>
    <button id="stopQR" class="secondary hidden" type="button">⏹️ Detener</button>
  </div>

  <!-- Controles FOTO -->
  <div class="controls hidden" id="photoControls">
    <button id="startPhoto" type="button">📷 Activar cámara trasera</button>
    <button id="capturePhoto" class="hidden" type="button">📸 Tomar fotografía</button>
    <button id="switchPhoto" class="secondary hidden" type="button">🔄 Cambiar cámara</button>
    <button id="stopPhoto" class="secondary hidden" type="button">⏹️ Detener</button>
  </div>

  <!-- ACEPTAR / RETOMAR -->
  <div class="controls hidden" id="resultControls">
    <button id="accept" type="button">✅ Usar esta fotografía</button>
    <button id="retake" class="secondary" type="button">🔄 Volver a tomar</button>
  </div>
</main>

<script>
(function() {
  const $ = id => document.getElementById(id);
  const video = $('video');
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const preview = $('preview');
  const cameraBox = $('cameraBox');
  const qrOverlay = $('qrOverlay');
  const status = $('status');

  const qrControls = $('qrControls');
  const startQRBtn = $('startQR');
  const switchQRBtn = $('switchQR');
  const stopQRBtn = $('stopQR');

  const photoControls = $('photoControls');
  const startPhotoBtn = $('startPhoto');
  const capturePhotoBtn = $('capturePhoto');
  const switchPhotoBtn = $('switchPhoto');
  const stopPhotoBtn = $('stopPhoto');

  const resultControls = $('resultControls');
  const acceptBtn = $('accept');
  const retakeBtn = $('retake');

  let mode = 'qr';
  let stream = null;
  let running = false;
  let currentFacing = 'environment';
  let lastValue = '';
  let capturedDataUrl = '';
  let scanTimerId = null;
  let autoIntentado = false;

  function send(val) {
    if (window.Streamlit && Streamlit.setComponentValue) Streamlit.setComponentValue(val);
  }

  function say(msg, kind) {
    status.textContent = msg;
    status.className = 'status' + (kind ? ' ' + kind : '');
    ajustarAlto();
  }

  function ajustarAlto() {
    if (window.Streamlit && Streamlit.setFrameHeight) {
      setTimeout(() => Streamlit.setFrameHeight(document.body.scrollHeight + 15), 60);
    }
  }

  function stop() {
    running = false;
    if (scanTimerId) { clearInterval(scanTimerId); scanTimerId = null; }
    if (stream) {
      stream.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
      stream = null;
    }
    video.srcObject = null;
    updateButtonVisibility();
  }

  function updateButtonVisibility() {
    qrControls.classList.toggle('hidden', mode !== 'qr');
    photoControls.classList.toggle('hidden', mode === 'qr');
    qrOverlay.classList.toggle('hidden', !(mode === 'qr' && running));

    if (mode === 'qr') {
      cameraBox.classList.remove('hidden');
      preview.classList.add('hidden');
      resultControls.classList.add('hidden');
      startQRBtn.classList.remove('hidden');
      startQRBtn.textContent = running ? '🟢 Cámara activa - escaneando…' : '📷 Activar cámara trasera';
      startQRBtn.disabled = running;
      switchQRBtn.classList.toggle('hidden', !running);
      stopQRBtn.classList.toggle('hidden', !running);
    } else if (capturedDataUrl) {
      cameraBox.classList.add('hidden');
      preview.classList.remove('hidden');
      photoControls.classList.add('hidden');
      resultControls.classList.remove('hidden');
    } else {
      cameraBox.classList.remove('hidden');
      preview.classList.add('hidden');
      resultControls.classList.add('hidden');
      startPhotoBtn.classList.toggle('hidden', running);
      capturePhotoBtn.classList.toggle('hidden', !running);
      switchPhotoBtn.classList.toggle('hidden', !running);
      stopPhotoBtn.classList.toggle('hidden', !running);
    }
    ajustarAlto();
  }

  async function start(facing) {
    stop();
    currentFacing = facing || currentFacing;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('Este navegador no permite acceso a la cámara desde aquí. Abre la app en Chrome (Android) o Safari (iPhone) y usa la opción «Cámara del dispositivo».', 'err');
      return;
    }
    const etiqueta = currentFacing === 'environment' ? 'trasera' : 'frontal';
    say('Solicitando permiso de cámara ' + etiqueta + '… Acepta el permiso del navegador.');
    const intentos = [
      { audio: false, video: { facingMode: { exact: currentFacing }, width: { ideal: 1280 }, height: { ideal: 720 } } },
      { audio: false, video: { facingMode: { ideal: currentFacing }, width: { ideal: 1280 }, height: { ideal: 720 } } },
      { audio: false, video: { facingMode: currentFacing } },
      { audio: false, video: true }
    ];
    let ultimoError = null;
    for (const c of intentos) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(c);
        if (stream) break;
      } catch(err) { ultimoError = err; }
    }
    if (!stream) {
      const nombre = ultimoError && ultimoError.name || 'Error';
      if (nombre === 'NotAllowedError' || nombre === 'SecurityError') {
        say('Permiso de cámara DENEGADO. Toca el candado / icono junto a la dirección del sitio y permite la cámara, luego pulsa de nuevo. Alternativa garantizada: usa la opción «Cámara del dispositivo».', 'err');
      } else if (nombre === 'NotFoundError') {
        say('No se encontró ninguna cámara disponible en este dispositivo.', 'err');
      } else {
        say('No se pudo abrir la cámara (' + nombre + '). Si estás dentro de una ventana integrada, abre la app a pantalla completa o usa «Cámara del dispositivo».', 'err');
      }
      updateButtonVisibility();
      return;
    }
    try {
      video.srcObject = stream;
      await video.play();
    } catch(e) {}
    running = true;
    capturedDataUrl = '';
    lastValue = '';
    updateButtonVisibility();
    if (mode === 'qr') {
      say('🟢 Cámara ' + etiqueta + ' activa. Apunta al código QR; la lectura es automática.', 'ok');
      iniciarEscaneo();
    } else {
      say('🟢 Cámara ' + etiqueta + ' lista. Encuadra y pulsa «Tomar fotografía».', 'ok');
    }
  }

  function iniciarEscaneo() {
    if (scanTimerId) clearInterval(scanTimerId);
    scanTimerId = setInterval(scanFrame, 120);
  }

  function scanFrame() {
    if (!running || mode !== 'qr') return;
    if (video.readyState < 2 || !video.videoWidth) return;
    const w = video.videoWidth;
    const h = video.videoHeight;
    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    let valor = null;
    try {
      if (window.BarcodeDetector) {
        const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
        detector.detect(video).then(codigos => {
          if (codigos && codigos.length && codigos[0].rawValue) procesarLectura(codigos[0].rawValue);
        }).catch(() => {});
        if (valor) return;
      }
      const imageData = ctx.getImageData(0, 0, w, h);
      const code = window.jsQR ? jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' }) : null;
      if (code && code.data && code.data.trim()) procesarLectura(code.data.trim());
    } catch(e) {}
  }

  function procesarLectura(val) {
    val = String(val || '').trim();
    if (!val || val === lastValue) return;
    lastValue = val;
    say('✅ Código QR reconocido: ' + val, 'ok');
    send(val);
    stop();
  }

  function captureSnapshot() {
    if (!running || !video.videoWidth) {
      say('Primero activa la cámara para capturar la imagen.', 'err');
      return;
    }
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    capturedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
    preview.src = capturedDataUrl;
    stop();
    say('Fotografía capturada. Revisa la imagen y confirma, o vuelve a tomarla.', 'ok');
    updateButtonVisibility();
  }

  function switchCamera() {
    start(currentFacing === 'environment' ? 'user' : 'environment');
  }

  startQRBtn.onclick = () => start('environment');
  switchQRBtn.onclick = switchCamera;
  stopQRBtn.onclick = () => { stop(); say('Cámara detenida.'); };

  startPhotoBtn.onclick = () => start('environment');
  capturePhotoBtn.onclick = captureSnapshot;
  switchPhotoBtn.onclick = switchCamera;
  stopPhotoBtn.onclick = () => { stop(); say('Cámara detenida.'); };

  acceptBtn.onclick = () => {
    if (capturedDataUrl) {
      send(capturedDataUrl);
      say('✅ Fotografía guardada y vinculada a la recepción.', 'ok');
    }
  };

  retakeBtn.onclick = () => {
    capturedDataUrl = '';
    preview.src = '';
    start('environment');
  };

  function onRender(event) {
    const args = (event && event.detail && event.detail.args) || (window.Streamlit && event.detail ? {} : {});
    mode = (args.mode === 'photo') ? 'photo' : 'qr';
    const targetH = Number(args.height || 400);
    video.style.maxHeight = Math.max(220, Math.min(targetH, 620)) + 'px';

    updateButtonVisibility();

    // Un único intento automático; si el navegador lo bloquea, el botón verde queda siempre visible.
    if (!running && !capturedDataUrl && !autoIntentado) {
      autoIntentado = true;
      if (mode === 'qr') {
        say('Iniciando lector QR institucional. Si no abre, pulsa «Activar cámara trasera».');
        start('environment');
      } else {
        say('Pulsa «Activar cámara trasera» para fotografiar las pertenencias.');
      }
    }
    ajustarAlto();
  }

  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'streamlit:render') onRender(e);
  });

  if (window.Streamlit) {
    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(460);
  }
  ajustarAlto();
})();
</script>
</body>
</html>
