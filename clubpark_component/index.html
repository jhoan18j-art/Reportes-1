<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:10px;font-family:Arial,sans-serif;color:#202124}video,canvas{width:100%;max-height:340px;object-fit:cover;border-radius:10px;background:#111}button{border:0;border-radius:8px;padding:11px 14px;background:#174a7e;color:#fff;font-weight:700;margin:8px 6px 0 0}#status{font-size:13px;margin:7px 0;color:#444}#result{font-weight:700;overflow-wrap:anywhere;color:#146c2e}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
<div id="status">Preparando cámara posterior…</div><video id="video" autoplay playsinline muted></video><canvas id="canvas" hidden></canvas>
<div><button id="capture" hidden>Tomar fotografía</button><button id="restart" hidden>Volver a escanear</button></div><div id="result"></div>
<script>
(() => {
 const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
 const status=document.getElementById('status'), capture=document.getElementById('capture'), restart=document.getElementById('restart'), result=document.getElementById('result');
 let mode='qr', stream=null, stopped=false, lastValue='';
 function send(value){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value},'*');}
 function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.min(500,document.body.scrollHeight+5)},'*');}
 async function start(){
   stopped=false; status.textContent='Solicitando cámara posterior…';
   try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    video.srcObject=stream; await video.play(); status.textContent= mode==='photo'?'Cámara posterior lista. Encuadra las pertenencias y toma la foto.':'Apunta al código QR; la lectura será automática.';
    capture.hidden=mode!=='photo'; restart.hidden=mode!=='qr'; height(); if(mode==='qr') requestAnimationFrame(scan);
   }catch(e){status.textContent='No se pudo abrir la cámara. Permite el permiso de cámara en Chrome y abre la app mediante HTTPS. Detalle: '+e.message; height();}
 }
 function scan(){
  if(stopped||mode!=='qr'||video.readyState<2)return requestAnimationFrame(scan);
  const w=video.videoWidth,h=video.videoHeight;if(w&&h){canvas.width=w;canvas.height=h;ctx.drawImage(video,0,0,w,h);const im=ctx.getImageData(0,0,w,h);if(window.jsQR){const code=jsQR(im.data,w,h,{inversionAttempts:'attemptBoth'});if(code&&code.data&&code.data!==lastValue){lastValue=code.data;stopped=true;result.textContent='QR leído: '+code.data;status.textContent='Lectura terminada.';send(code.data);height();return;}}}
  requestAnimationFrame(scan);
 }
 capture.addEventListener('click',()=>{if(!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',0.88);status.textContent='Fotografía capturada.';send(data);});
 restart.addEventListener('click',()=>{lastValue='';result.textContent='';stopped=false;status.textContent='Buscando QR…';requestAnimationFrame(scan);});
 window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='streamlit:render'){mode=(d.args&&d.args.mode)||'qr';height();if(!stream)start();else{capture.hidden=mode!=='photo';restart.hidden=mode!=='qr';if(mode==='qr'){stopped=false;requestAnimationFrame(scan);}}}});
 parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
})();
</script>
</body></html>
